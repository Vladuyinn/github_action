name: CI python

on :
  push:
    branches:
      - master
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
  steps:

    - uses: actions/checkout@v4
      name: check code

    - uses: actions/setup-python@v5
      name : setup python
      with:
        python-version: 3.10.12
    
    - name: install dependencies
      run: |
        pip install fastapi locust pytest uvicorn coverage httpx pytest-mock pytest-profiling pylint sqlalchemy pydanticgit push
    
    - name: run tests
      run: |
        pytest